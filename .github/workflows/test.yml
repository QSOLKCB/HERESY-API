name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q heresy.py tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Smoke-test museum
        run: python heresy.py

      - name: Smoke-test machine-readable joke
        run: python heresy.py --json >/dev/null
